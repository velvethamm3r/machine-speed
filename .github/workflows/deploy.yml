name: Build and deploy site

# Runs automatically every time data.json (or anything else) is pushed,
# and can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow commit archive snapshots back
  pages: write      # lets it publish to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to a major tag, which is what picks up the
      # Node runtime the action runs on. GitHub retired Node 20 from its runners
      # and every one of these had to move to a major that targets Node 24;
      # checkout v4 and upload-pages-artifact v3 were the two that had not. If a
      # deprecation warning about a Node version appears in the Actions log
      # again, this block of three lines is the whole fix.
      - name: Get the site files
        uses: actions/checkout@v6

      - name: Build the site
        run: python3 build.py

      - name: Save today's archive snapshot and newsletter draft into the repo
        run: |
          git config user.name "machine-speed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/ newsletter/
          if ! git diff --cached --quiet; then
            git commit -m "Save archive snapshot + newsletter draft [skip ci]"
            git push
          fi

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
